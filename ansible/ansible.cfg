#  ansible.cfg (workflows)

[defaults]
interpreter_python = auto_silent
inventory = inventory
playbook_dir = playbooks
remote_user = jeff
vault_password_file = ~/.vault_pass

[privilege_escalation]
# Privilege escalation method to use when `become` is enabled.
become_method=sudo

[inventory]
# List of enabled inventory plugins, it also determines the order in which they are used.
enable_plugins=host_list, yaml, script, auto, ini, toml

#  End of my settings  #
